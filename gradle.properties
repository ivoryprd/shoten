org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# ML Kit's R8 rules (e.g. "-keep class * implements ComponentRegistrar") rely on kept classes
# keeping their constructors, which R8's default full mode doesn't do. Without this, the minified
# app crashed on start because ML Kit couldn't create its components.
android.enableR8.fullMode=false
