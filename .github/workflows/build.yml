name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew --no-daemon testStandardDebugUnitTest lintStandardDebug lintOfflineDebug assembleRelease

      # Without a keystore.properties file, release APKs are signed with the runner's debug key.
      # They install fine, but updates require uninstalling first unless you sign with your own key.
      - uses: actions/upload-artifact@v4
        with:
          name: shoten-apks
          path: app/build/outputs/apk/*/release/*.apk
